<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Randevu · Maison Makas</title>
<style>
  :root {
    --zemin: #0e0e10;
    --kart: #17171b;
    --girdi: #101013;
    --cizgi: #2a2a2e;
    --yazi: #f3ede2;
    --soluk: #a39c90;
    --vurgu: #c9a96e;
    --hata-zemin: #2a1714;
    --hata-cizgi: #5a2a22;
    --hata-yazi: #f3c4b8;
  }
  body { margin: 0; background: var(--zemin); color: var(--yazi); font-family: Arial, Helvetica, sans-serif; font-size: 15px; line-height: 1.5; }
  main { max-width: 520px; margin: 0 auto; padding: 20px 16px 56px; }
  .marka { letter-spacing: 4px; font-size: 12px; color: var(--vurgu); margin: 4px 0 12px; }
  h1 { font-family: Georgia, 'Times New Roman', serif; font-weight: 500; font-size: 30px; line-height: 1.15; margin: 0 0 6px; }
  .soluk { color: var(--soluk); font-size: 13px; line-height: 1.45; }
  .kart { background: var(--kart); border: 1px solid var(--cizgi); border-radius: 16px; padding: 16px; margin: 14px 0; }
  .baslik { font-size: 12px; letter-spacing: 2px; color: var(--vurgu); margin: 0 0 10px; }
  .liste { display: flex; flex-direction: column; gap: 8px; }
  .secenek { display: flex; align-items: center; gap: 12px; padding: 12px; min-height: 52px; border: 1px solid var(--cizgi); border-radius: 12px; cursor: pointer; }
  .secenek:has(input:checked) { border-color: var(--vurgu); }
  .secenek input { accent-color: var(--vurgu); width: 20px; height: 20px; margin: 0; flex: none; }
  .secenek .ad { flex: 1; }
  .secenek .not { color: var(--soluk); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: transparent; color: var(--yazi); border: 1px solid var(--cizgi); border-radius: 999px; padding: 10px 14px; min-height: 44px; font: inherit; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--vurgu); color: #0e0e10; border-color: var(--vurgu); font-weight: 700; }
  .chip:disabled { opacity: .35; cursor: not-allowed; }
  .kucuk { min-height: 36px; padding: 6px 12px; font-size: 13px; }
  input.metin, textarea.metin { width: 100%; background: var(--girdi); border: 1px solid var(--cizgi); color: var(--yazi); border-radius: 12px; padding: 14px; font: inherit; font-size: 16px; min-height: 52px; box-sizing: border-box; }
  textarea.metin { min-height: 80px; resize: vertical; }
  .alan { margin-top: 12px; }
  .alan label { display: block; font-size: 12px; letter-spacing: 1.5px; color: var(--soluk); margin-bottom: 6px; }
  .dugme { width: 100%; min-height: 56px; background: var(--vurgu); color: #0e0e10; border: 0; border-radius: 14px; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 14px; }
  .dugme:disabled { opacity: .5; cursor: default; }
  .ikinci { background: transparent; color: var(--vurgu); border: 1px solid var(--vurgu); }
  .hata { background: var(--hata-zemin); border: 1px solid var(--hata-cizgi); color: var(--hata-yazi); border-radius: 12px; padding: 12px 14px; margin: 14px 0 0; }
  .bilgi { background: #17201a; border: 1px solid #2d4a35; color: #cfe6d4; border-radius: 12px; padding: 12px 14px; margin: 14px 0 0; }
  .sepet-kalem { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--cizgi); }
  .sepet-kalem:first-of-type { border-top: 0; padding-top: 0; }
  .sepet-kalem .govde { flex: 1; min-width: 0; }
  .sepet-kalem .isim { font-weight: 700; }
  .toplam { display: flex; justify-content: space-between; border-top: 1px solid var(--cizgi); margin-top: 6px; padding-top: 12px; font-weight: 700; }
  a { color: var(--vurgu); }
  .adim { margin-top: 26px; }
</style>
</head>
<body>
<main>
  <p class="marka">MAISON MAKAS</p>
  <h1 id="salonAd">Randevu</h1>
  <div id="uyg" aria-live="polite"></div>
  <p class="soluk" style="text-align:center;margin-top:28px"><a href="../gizlilik.html">Gizlilik politikası</a> · <a href="../kvkk.html">KVKK aydınlatma</a></p>
</main>

<script>
(function () {
  'use strict';

  var SB = 'https://fhxwtfefinoaetlpxbpr.supabase.co';
  var KEY = 'sb_publishable_DL9ZhXeclsp_eI3MrMK9cQ_-dgK5Pdy';
  var TZ = 'Europe/Istanbul';
  var GUN_SAYISI = 14;
  var SEPET_UST = 8;
  var kok = document.getElementById('uyg');

  var fmtSaat = new Intl.DateTimeFormat('tr-TR', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
  var fmtTarih = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });

  var S = {
    yukleniyor: true,
    hata: null,
    bilgi: null,
    salon: null,
    hizmetler: [],
    ustalar: [],
    // Sepete eklenecek kalemin formu (bir kişi, bir randevu).
    form: { kisi: '', hizmetIdler: [], usta: '', gun: '', saat: '' },
    slotlar: [],
    slotYukleniyor: false,
    sorgu: 0,
    // Sepet: her kalem ayrı bir randevu.
    sepet: [],
    sepetSayac: 0,
    iletisim: { ad: '', tel: '', not: '' },
    gonderiliyor: false,
    tamam: null
  };

  // ------------------------------------------------------------ yardımcılar

  function el(tag, props) {
    var e = document.createElement(tag);
    for (var k in (props || {})) {
      var v = props[k];
      if (v === undefined || v === null || v === false) { continue; }
      if (k === 'text') { e.textContent = v; }
      else if (k === 'value') { e.value = v; }
      else if (k === 'checked') { e.checked = !!v; }
      else if (k === 'disabled') { e.disabled = !!v; }
      else if (k === 'onclick') { e.addEventListener('click', v); }
      else if (k === 'oninput') { e.addEventListener('input', v); }
      else if (k === 'onchange') { e.addEventListener('change', v); }
      else { e.setAttribute(k, v === true ? '' : String(v)); }
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c === null || c === undefined || c === false) { continue; }
      e.append(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return e;
  }

  function tl(n) {
    return Number(n).toLocaleString('tr-TR', { style: 'currency', currency: 'TRY', maximumFractionDigits: 0 });
  }

  function bugunTarih() { return fmtTarih.format(new Date()); }

  function tarihEkle(t, n) {
    var p = t.split('-').map(Number);
    return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10);
  }

  function gunEtiketi(t, i) {
    if (i === 0) { return 'Bugün'; }
    if (i === 1) { return 'Yarın'; }
    return new Date(t + 'T12:00:00+03:00').toLocaleDateString('tr-TR', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' });
  }

  function zamanMetni(iso) {
    var t = fmtTarih.format(new Date(iso));
    return gunEtiketi(t, bugunTarih() === t ? 0 : (t === tarihEkle(bugunTarih(), 1) ? 1 : -1)) + ', saat ' + fmtSaat.format(new Date(iso));
  }

  function hataCevir(v, kod) {
    var m = (v && typeof v === 'object' && (v.message || v.msg || v.error_description || v.error)) || '';
    if (m) { return m; }
    return 'Bir sorun oluştu (hata kodu ' + kod + '). Tekrar dene.';
  }

  function istek(yol, o) {
    o = o || {};
    var h = { apikey: KEY, Authorization: 'Bearer ' + KEY };
    var init = { method: o.metod || 'GET', headers: h };
    if (o.govde !== undefined) {
      h['Content-Type'] = 'application/json';
      init.body = JSON.stringify(o.govde);
    }
    return fetch(SB + yol, init).then(function (r) {
      return r.text().then(function (metin) {
        var v = null;
        try { v = metin ? JSON.parse(metin) : null; } catch (e) { v = metin; }
        if (!r.ok) { throw new Error(hataCevir(v, r.status)); }
        return v;
      });
    }, function () {
      throw new Error('Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene.');
    });
  }

  function secilenHizmetler(ids) {
    return S.hizmetler.filter(function (h) { return ids.indexOf(h.id) !== -1; });
  }

  function ustaAdi(id) {
    var u = S.ustalar.filter(function (x) { return x.id === id; })[0];
    return u ? u.ad : '';
  }

  function telefonGecerli(t) { return t.replace(/\D/g, '').length >= 10; }

  // ------------------------------------------------------------ veri

  function yukle() {
    var s = new URLSearchParams(location.search).get('s') || '';
    if (!/^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$/.test(s)) {
      S.hata = 'Bu bağlantı geçersiz. Salonun QR kodunu yeniden okut.';
      S.yukleniyor = false;
      return ciz();
    }
    istek('/rest/v1/salonlar?kisa_ad=eq.' + encodeURIComponent(s) +
      '&yayinda=eq.true&select=id,ad,aciklama,telefon,adres,ilce,sehir,ucretsiz_iptal_dk')
      .then(function (sa) {
        if (!sa.length) {
          S.hata = 'Bu salon şu anda randevu almıyor.';
          return null;
        }
        S.salon = sa[0];
        document.getElementById('salonAd').textContent = S.salon.ad;
        document.title = S.salon.ad + ' · Randevu';
        return Promise.all([
          istek('/rest/v1/hizmetler?salon_id=eq.' + S.salon.id + '&aktif=eq.true&select=id,ad,sure_dk,fiyat,kategori&order=sira.asc'),
          istek('/rest/v1/ustalar?salon_id=eq.' + S.salon.id + '&aktif=eq.true&select=id,ad,unvan&order=sira.asc')
        ]).then(function (sonuc) {
          S.hizmetler = sonuc[0];
          S.ustalar = sonuc[1];
        });
      })
      .catch(function (e) { S.hata = e.message; })
      .then(function () {
        S.yukleniyor = false;
        ciz();
      });
  }

  function slotlariGetir() {
    var no = ++S.sorgu;
    S.slotlar = [];
    S.form.gun = '';
    S.form.saat = '';
    if (!S.form.hizmetIdler.length) { return ciz(); }
    S.slotYukleniyor = true;
    ciz();
    istek('/rest/v1/rpc/musait_saatler', {
      metod: 'POST',
      govde: {
        p_salon: S.salon.id,
        p_bas: bugunTarih(),
        p_gun_sayisi: GUN_SAYISI,
        p_hizmetler: S.form.hizmetIdler,
        p_usta: S.form.usta || null
      }
    }).then(function (satirlar) {
      if (no !== S.sorgu) { return; }
      S.slotlar = satirlar || [];
    }).catch(function (e) {
      if (no !== S.sorgu) { return; }
      S.hata = e.message;
    }).then(function () {
      if (no !== S.sorgu) { return; }
      S.slotYukleniyor = false;
      ciz();
    });
  }

  // gün -> saat (iso) -> usta_id; aynı saatte birden çok usta varsa ilki
  function takvim() {
    var harita = {};
    S.slotlar.forEach(function (s) {
      var gun = fmtTarih.format(new Date(s.baslangic));
      if (!harita[gun]) { harita[gun] = {}; }
      if (!harita[gun][s.baslangic]) { harita[gun][s.baslangic] = s.usta_id; }
    });
    return harita;
  }

  // ------------------------------------------------------------ sepet

  function sepeteEkle() {
    var kisi = S.form.kisi.trim();
    if (kisi.length < 2) { S.hata = 'Randevu kimin için? Adını yaz (en az 2 harf).'; return ciz(); }
    if (!S.form.hizmetIdler.length) { S.hata = 'En az bir hizmet seç.'; return ciz(); }
    var ustaId = takvim()[S.form.gun] && takvim()[S.form.gun][S.form.saat];
    if (!ustaId) { S.hata = 'Önce gün ve saat seç.'; return ciz(); }

    var hizmetler = secilenHizmetler(S.form.hizmetIdler);
    var sureDk = hizmetler.reduce(function (t, h) { return t + h.sure_dk; }, 0);
    var baslangic = new Date(S.form.saat);
    var bitis = new Date(baslangic.getTime() + sureDk * 60000);

    // Aynı usta ya da aynı kişi için sepette çakışan kalem olmasın.
    var cakisan = S.sepet.filter(function (k) {
      return (k.usta === ustaId || k.kisi.toLowerCase() === kisi.toLowerCase()) &&
        baslangic < new Date(k.bitis) && new Date(k.baslangic) < bitis;
    })[0];
    if (cakisan) {
      S.hata = 'Bu saat sepetteki ' + (cakisan.usta === ustaId ? '"' + cakisan.kisi + '" randevusuyla çakışıyor.' : 'randevuyla çakışıyor.') + ' Başka saat seç.';
      return ciz();
    }
    if (S.sepet.length >= SEPET_UST) {
      S.hata = 'Bir seferde en çok ' + SEPET_UST + ' randevu alınabilir.';
      return ciz();
    }

    S.sepetSayac++;
    S.sepet.push({
      id: S.sepetSayac,
      kisi: kisi,
      hizmetIdler: S.form.hizmetIdler.slice(),
      hizmetAdlari: hizmetler.map(function (h) { return h.ad; }).join(', '),
      usta: ustaId,
      ustaAd: ustaAdi(ustaId),
      baslangic: S.form.saat,
      bitis: bitis.toISOString(),
      sureDk: sureDk,
      fiyat: hizmetler.reduce(function (t, h) { return t + Number(h.fiyat); }, 0)
    });

    // Formu bir sonraki kişi için sıfırla.
    S.form = { kisi: '', hizmetIdler: [], usta: '', gun: '', saat: '' };
    S.slotlar = [];
    S.hata = null;
    S.bilgi = 'Sepete eklendi. Bir kişi daha ekleyebilirsin ya da randevuları onaylayabilirsin.';
    ciz();
  }

  function sepettenCikar(id) {
    S.sepet = S.sepet.filter(function (k) { return k.id !== id; });
    S.hata = null;
    S.bilgi = null;
    ciz();
  }

  function randevulariOnayla() {
    if (!S.sepet.length) { S.hata = 'Sepet boş. Önce bir randevu ekle.'; return ciz(); }
    if (S.iletisim.ad.trim().length < 2) { S.hata = 'İletişim için adını yaz (en az 2 harf).'; return ciz(); }
    if (!telefonGecerli(S.iletisim.tel)) { S.hata = 'Telefon numaranı yaz (örnek: 0532 123 45 67).'; return ciz(); }

    S.gonderiliyor = true;
    S.hata = null;
    S.bilgi = null;
    ciz();
    var gonderilen = S.sepet.slice();
    istek('/rest/v1/rpc/qr_sepet_randevu_al', {
      metod: 'POST',
      govde: {
        p_salon: S.salon.id,
        p_ad: S.iletisim.ad.trim(),
        p_tel: S.iletisim.tel.trim(),
        p_kalemler: gonderilen.map(function (k) {
          return { kisi: k.kisi, baslangic: k.baslangic, usta: k.usta, hizmetler: k.hizmetIdler };
        }),
        p_not: S.iletisim.not.trim() || null
      }
    }).then(function () {
      S.tamam = gonderilen;
      S.sepet = [];
    }).catch(function (e) {
      // Sepet korunur: kullanıcı çakışan kalemi çıkarıp yeniden deneyebilir.
      S.hata = e.message;
    }).then(function () {
      S.gonderiliyor = false;
      ciz();
    });
  }

  // ------------------------------------------------------------ görünüm

  function salonKarti() {
    var s = S.salon;
    var konum = [s.ilce, s.sehir].filter(Boolean).join(' / ');
    return el('section', { class: 'kart' },
      s.adres ? el('p', { text: s.adres, class: 'soluk', style: 'margin:0 0 4px' }) : null,
      konum ? el('p', { text: konum, class: 'soluk', style: 'margin:0 0 4px' }) : null,
      s.telefon ? el('p', { class: 'soluk', style: 'margin:0' }, el('a', { href: 'tel:' + s.telefon.replace(/\s/g, ''), text: s.telefon })) : null,
      s.aciklama ? el('p', { text: s.aciklama, style: 'margin:12px 0 0' }) : null
    );
  }

  function kisiBolumu() {
    return el('section', { class: 'kart' },
      el('p', { class: 'baslik', text: '1 · KİM İÇİN' }),
      el('input', {
        class: 'metin', type: 'text', placeholder: 'Örn: Ahmet, Semiha', value: S.form.kisi, maxlength: 80,
        oninput: function (e) { S.form.kisi = e.target.value; }
      }),
      el('p', { class: 'soluk', style: 'margin:8px 0 0', text: 'Aile için birden çok randevu alabilirsin. Her kişiyi ayrı ayrı sepete ekle.' })
    );
  }

  function hizmetBolumu() {
    var kutu = el('div', { class: 'liste' });
    S.hizmetler.forEach(function (h) {
      var secili = S.form.hizmetIdler.indexOf(h.id) !== -1;
      kutu.append(el('label', { class: 'secenek' },
        el('input', {
          type: 'checkbox',
          checked: secili,
          onchange: function () {
            var i = S.form.hizmetIdler.indexOf(h.id);
            if (i === -1) { S.form.hizmetIdler.push(h.id); } else { S.form.hizmetIdler.splice(i, 1); }
            slotlariGetir();
          }
        }),
        el('span', { class: 'ad' }, h.ad, el('span', { class: 'not' }, ' · ' + h.sure_dk + ' dk')),
        el('span', { text: tl(h.fiyat) })
      ));
    });
    if (!S.hizmetler.length) {
      kutu.append(el('p', { class: 'soluk', text: 'Bu salonda henüz hizmet tanımlanmamış.' }));
    }
    return el('section', { class: 'kart' }, el('p', { class: 'baslik', text: '2 · HİZMET' }), kutu);
  }

  function ustaBolumu() {
    var kutu = el('div', { class: 'chips' });
    var secenekler = [{ id: '', ad: 'Fark etmez' }].concat(S.ustalar.map(function (u) {
      return { id: u.id, ad: u.ad + (u.unvan ? ' · ' + u.unvan : '') };
    }));
    secenekler.forEach(function (o) {
      kutu.append(el('button', {
        class: 'chip',
        type: 'button',
        'aria-pressed': S.form.usta === o.id ? 'true' : 'false',
        text: o.ad,
        onclick: function () {
          if (S.form.usta === o.id) { return; }
          S.form.usta = o.id;
          slotlariGetir();
        }
      }));
    });
    return el('section', { class: 'kart' }, el('p', { class: 'baslik', text: '3 · USTA' }), kutu);
  }

  function zamanBolumu() {
    var kart = el('section', { class: 'kart' }, el('p', { class: 'baslik', text: '4 · GÜN VE SAAT' }));
    if (!S.form.hizmetIdler.length) {
      kart.append(el('p', { class: 'soluk', text: 'Önce bir hizmet seç.' }));
      return kart;
    }
    if (S.slotYukleniyor) {
      kart.append(el('p', { class: 'soluk', text: 'Boş saatler aranıyor…' }));
      return kart;
    }
    var harita = takvim();
    var bugun = bugunTarih();
    var gunKutu = el('div', { class: 'chips' });
    for (var i = 0; i < GUN_SAYISI; i++) {
      (function (t, idx) {
        var bos = harita[t] ? Object.keys(harita[t]).length : 0;
        gunKutu.append(el('button', {
          class: 'chip',
          type: 'button',
          disabled: bos === 0,
          'aria-pressed': S.form.gun === t ? 'true' : 'false',
          text: gunEtiketi(t, idx),
          onclick: function () {
            S.form.gun = t;
            S.form.saat = '';
            ciz();
          }
        }));
      })(tarihEkle(bugun, i), i);
    }
    kart.append(gunKutu);
    if (!S.slotlar.length) {
      kart.append(el('p', { class: 'soluk', text: 'Önümüzdeki 14 günde boş saat yok. Başka bir hizmet ya da usta dene.' }));
    }
    if (S.form.gun && harita[S.form.gun]) {
      var saatler = Object.keys(harita[S.form.gun]).sort();
      var saatKutu = el('div', { class: 'chips', style: 'margin-top:12px' });
      saatler.forEach(function (iso) {
        saatKutu.append(el('button', {
          class: 'chip',
          type: 'button',
          'aria-pressed': S.form.saat === iso ? 'true' : 'false',
          text: fmtSaat.format(new Date(iso)),
          onclick: function () {
            S.form.saat = iso;
            ciz();
          }
        }));
      });
      kart.append(saatKutu);
    }
    return kart;
  }

  function sepeteEkleBolumu() {
    return el('button', {
      class: 'dugme',
      type: 'button',
      disabled: S.sepet.length >= SEPET_UST,
      text: 'Sepete ekle',
      onclick: sepeteEkle
    });
  }

  function sepetBolumu() {
    var kart = el('section', { class: 'kart' }, el('p', { class: 'baslik', text: 'SEPETİN · ' + S.sepet.length + ' RANDEVU' }));
    S.sepet.forEach(function (k) {
      kart.append(el('div', { class: 'sepet-kalem' },
        el('div', { class: 'govde' },
          el('div', { class: 'isim', text: k.kisi }),
          el('div', { class: 'soluk', text: k.hizmetAdlari }),
          el('div', { class: 'soluk', text: (k.ustaAd || 'Fark etmez') + ' · ' + zamanMetni(k.baslangic) }),
          el('div', { class: 'soluk', text: tl(k.fiyat) })
        ),
        el('button', { class: 'chip kucuk', type: 'button', text: 'Çıkar', onclick: function () { sepettenCikar(k.id); } })
      ));
    });
    var toplam = S.sepet.reduce(function (t, k) { return t + k.fiyat; }, 0);
    kart.append(el('div', { class: 'toplam' }, el('span', { text: 'Toplam' }), el('span', { text: tl(toplam) })));
    return kart;
  }

  function iletisimBolumu() {
    return el('section', { class: 'kart' },
      el('p', { class: 'baslik', text: '5 · İLETİŞİM' }),
      el('div', { class: 'alan', style: 'margin-top:0' },
        el('label', { text: 'ADIN SOYADIN' }),
        el('input', { class: 'metin', type: 'text', autocomplete: 'name', placeholder: 'Ad Soyad', value: S.iletisim.ad, maxlength: 80, oninput: function (e) { S.iletisim.ad = e.target.value; } })
      ),
      el('div', { class: 'alan' },
        el('label', { text: 'TELEFON' }),
        el('input', { class: 'metin', type: 'tel', inputmode: 'tel', autocomplete: 'tel', placeholder: '0532 123 45 67', value: S.iletisim.tel, maxlength: 20, oninput: function (e) { S.iletisim.tel = e.target.value; } })
      ),
      el('div', { class: 'alan' },
        el('label', { text: 'NOT (İSTEĞE BAĞLI)' }),
        el('textarea', { class: 'metin', maxlength: 300, value: S.iletisim.not, oninput: function (e) { S.iletisim.not = e.target.value; } })
      ),
      el('p', { class: 'soluk', style: 'margin-top:10px', text: 'Randevular bu telefonla takip edilir. Değişiklik ya da iptal için salonu ara.' }),
      el('button', {
        class: 'dugme',
        type: 'button',
        disabled: S.gonderiliyor,
        text: S.gonderiliyor ? 'Gönderiliyor…' : 'Sepetteki ' + S.sepet.length + ' randevuyu onayla',
        onclick: randevulariOnayla
      })
    );
  }

  function tamamKarti() {
    var kart = el('section', { class: 'kart' }, el('p', { class: 'baslik', text: 'RANDEVULARIN ALINDI' }),
      el('p', { text: S.salon.ad + ' salonunda ' + S.tamam.length + ' randevun kaydedildi.' }));
    S.tamam.forEach(function (k) {
      kart.append(el('div', { class: 'sepet-kalem' },
        el('div', { class: 'govde' },
          el('div', { class: 'isim', text: k.kisi }),
          el('div', { class: 'soluk', text: k.hizmetAdlari }),
          el('div', { class: 'soluk', text: (k.ustaAd || 'Fark etmez') + ' · ' + zamanMetni(k.baslangic) })
        )
      ));
    });
    if (S.salon.telefon) {
      kart.append(el('p', { class: 'soluk', style: 'margin:10px 0 0' }, 'Değişiklik için salonu ara: ', el('a', { href: 'tel:' + S.salon.telefon.replace(/\s/g, ''), text: S.salon.telefon })));
    }
    kart.append(el('button', {
      class: 'dugme ikinci',
      type: 'button',
      text: 'Yeni randevu al',
      onclick: function () { S.tamam = null; S.iletisim = { ad: '', tel: '', not: '' }; ciz(); }
    }));
    return kart;
  }

  function ciz() {
    kok.replaceChildren();
    if (S.yukleniyor) {
      kok.append(el('p', { class: 'soluk', text: 'Yükleniyor…' }));
      return;
    }
    if (!S.salon) {
      kok.append(el('div', { class: 'hata', text: S.hata || 'Salon bulunamadı.' }));
      return;
    }
    if (S.tamam) {
      kok.append(tamamKarti());
      return;
    }
    kok.append(salonKarti());
    kok.append(el('div', { class: 'adim' }, kisiBolumu()));
    kok.append(el('div', { class: 'adim' }, hizmetBolumu()));
    kok.append(el('div', { class: 'adim' }, ustaBolumu()));
    kok.append(el('div', { class: 'adim' }, zamanBolumu()));
    kok.append(el('div', { class: 'adim' }, sepeteEkleBolumu()));
    if (S.bilgi) {
      kok.append(el('div', { class: 'bilgi', role: 'status', text: S.bilgi }));
    }
    if (S.sepet.length) {
      kok.append(el('div', { class: 'adim' }, sepetBolumu()));
      kok.append(el('div', { class: 'adim' }, iletisimBolumu()));
    }
    if (S.hata) {
      kok.append(el('div', { class: 'hata', role: 'alert', text: S.hata }));
    }
  }

  yukle();
})();
</script>
</body>
</html>
