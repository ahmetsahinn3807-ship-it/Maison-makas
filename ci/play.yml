name: Google Play paketi

on:
  workflow_dispatch:
  schedule:
    # Her gün 06:17 UTC: sunucu nöbeti (Supabase ücretsiz projeyi 7 gün kullanılmazsa durdurur).
    - cron: '17 6 * * *'

permissions:
  contents: write

concurrency:
  group: play-paketi
  cancel-in-progress: false

jobs:
  nobet:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Supabase nobeti
        run: bash ci/nobet.sh

  aab:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: AAB derle (yukleme anahtariyla)
        env:
          MAISON_PLAY_PAROLA: ${{ secrets.MAISON_PLAY_PAROLA }}
        run: bash ci/play.sh

      - name: Paketleri yukle
        uses: actions/upload-artifact@v4
        with:
          name: google-play-aab-${{ github.run_number }}
          path: cikti-play/*
          if-no-files-found: error
          retention-days: 90
